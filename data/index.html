<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PV Dimmer</title>
  <link rel="icon" type="image/svg+xml" href="/icons.svg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Overlay mobile -->
  <div id="overlay" class="overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="logo">
      <svg viewBox="0 0 16 16" aria-hidden="true" style="transform:rotate(-15deg)"><use href="/icons.svg#icon-laugh-wink"/></svg>
      <span>PV Dimmer</span>
    </div>
    <div class="device-info">
      <div class="version" id="sidebar-version">---</div>
      <div id="sidebar-rssi">RSSI: ---</div>
      <div id="sidebar-name">---</div>
    </div>
    <nav>
      <a href="#dashboard">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-dashboard"/></svg>
        <span data-i18n="nav.dashboard">Dashboard</span>
      </a>
      <a href="#config">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-config"/></svg>
        <span data-i18n="nav.config">Configuration</span>
      </a>
      <a href="#mqtt">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-mqtt"/></svg>
        <span data-i18n="nav.mqtt">MQTT</span>
      </a>
      <a href="#minuteur">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-timer"/></svg>
        <span data-i18n="nav.minuteur">Minuteur</span>
      </a>
      <div class="divider"></div>
      <a href="#log">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-log"/></svg>
        <span data-i18n="nav.log">Console Logs</span>
      </a>
      <a href="#backup">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-backup"/></svg>
        <span data-i18n="nav.backup">Sauvegardes</span>
      </a>
      <a href="#security">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-lock"/></svg>
        <span data-i18n="nav.security">Sécurité</span>
      </a>
      <div class="divider"></div>
      <a href="/update" style="color:var(--text-sidebar)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-update"/></svg>
        <span data-i18n="nav.update">OTA Update</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button id="rebootBtn">
        <svg viewBox="0 0 16 16" aria-hidden="true" style="width:14px;height:14px;fill:currentColor;vertical-align:-2px;margin-right:4px"><use href="/icons.svg#icon-power"/></svg>
        <span data-i18n="topbar.reboot">Reboot</span>
      </button>
    </div>
  </aside>

  <!-- Topbar -->
  <header id="topbar">
    <div style="display:flex;align-items:center;gap:.75rem">
      <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/></svg>
      </button>
      <div class="status-group">
        <span class="status-badge" id="topbar-wifi">
          <svg viewBox="0 0 16 16" aria-hidden="true" style="width:12px;height:12px;fill:currentColor"><use href="/icons.svg#icon-wifi"/></svg>
          WiFi
        </span>
      </div>
    </div>
    <div class="right-group">
      <div class="clock">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-clock"/></svg>
        <span id="clock">--:--:--</span>
      </div>
      <select id="langSelect" class="lang-select" data-i18n-title="topbar.lang_title" title="Langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
      <button class="theme-toggle" id="themeToggle" data-i18n-title="topbar.theme_title" title="Changer le theme">
        <svg viewBox="0 0 16 16" aria-hidden="true"><use href="/icons.svg#icon-moon"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main id="main">
    <div id="pageContent">
      <div class="spinner"></div>
    </div>
  </main>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // Load device info in sidebar on boot
    fetch('/state').then(r => r.json()).then(d => {
      const v = document.getElementById('sidebar-version');
      const r2 = document.getElementById('sidebar-rssi');
      const n = document.getElementById('sidebar-name');
      if (v) v.textContent = 'Version 20260509';
      if (r2 && d.RSSI !== undefined) r2.textContent = 'RSSI: ' + d.RSSI + ' dBm';
    }).catch(() => {});
    fetch('/config').then(r => r.json()).then(d => {
      const n = document.getElementById('sidebar-name');
      if (n && d.dimmername) n.textContent = d.dimmername + '.local';
      document.title = 'PV Dimmer - ' + (d.dimmername || '');
    }).catch(() => {});
  </script>
</body>
</html>
